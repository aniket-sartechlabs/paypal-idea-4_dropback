services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dropback
      POSTGRES_USER: dropback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - dropback_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropback -d dropback"]
      interval: 5s
      timeout: 4s
      retries: 12

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      DATABASE_URL: postgresql+psycopg://dropback:${POSTGRES_PASSWORD}@db:5432/dropback
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 4

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  dropback_pgdata:
